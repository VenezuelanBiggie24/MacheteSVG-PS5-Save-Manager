<!DOCTYPE html>
<html lang="en" style="background: #070b19;">
<head>
  <meta charset="UTF-8">
  <title>MacheteSVG Banner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px;
      height: 380px;
      background: #070b19 radial-gradient(circle at 85% 20%, rgba(68, 102, 242, 0.45) 0%, transparent 60%),
                  radial-gradient(circle at 15% 80%, rgba(118, 214, 255, 0.3) 0%, transparent 50%),
                  linear-gradient(135deg, #070b19 0%, #0d132b 50%, #12193b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 70px;
      gap: 50px;
    }
    .logo-container {
      width: 190px;
      height: 190px;
      border-radius: 40px;
      border: 2px solid rgba(118, 214, 255, 0.6);
      box-shadow: 0 0 50px rgba(118, 214, 255, 0.35), 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .title {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(118, 214, 255, 0.4);
    }
    .version-tag {
      font-size: 16px;
      font-weight: 700;
      color: #76d6ff;
      background: rgba(118, 214, 255, 0.15);
      border: 1.5px solid rgba(118, 214, 255, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 21px;
      color: #cbd5e1;
      font-weight: 500;
      max-width: 820px;
      line-height: 1.4;
    }
    .badges-row {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }
    .badge {
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      letter-spacing: 0.3px;
    }
    .badge-cyan {
      background: rgba(118, 214, 255, 0.15);
      border: 1px solid rgba(118, 214, 255, 0.4);
      color: #76d6ff;
    }
    .badge-green {
      background: rgba(56, 239, 125, 0.15);
      border: 1px solid rgba(56, 239, 125, 0.4);
      color: #38ef7d;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="icon0_512x512.png" class="logo-img" alt="MacheteSVG Logo">
  </div>
  <div class="content">
    <div class="title-row">
      <div class="title">MacheteSVG</div>
      <div class="version-tag">PPSA99001 • v1.0.0</div>
    </div>
    <div class="subtitle">
      Native PS5 & PS4 Savegame Manager with Keystone Protection, Autonomous Sandbox Escape, and Web Save Station (LAN/Wi-Fi)
    </div>
    <div class="badges-row">
      <div class="badge badge-cyan">PS5 FW 7.00 - 13.60</div>
      <div class="badge badge-green">Zero Corruption (CE-108255-1 Safe)</div>
      <div class="badge">Web Save Station (HTTP :8080)</div>
      <div class="badge">DualSense Audio & Haptics</div>
      <div class="badge">GPL-3.0</div>
    </div>
  </div>
</body>
</html>
